name: 백테스트 실행

on:
  workflow_dispatch:
    inputs:
      source:
        description: "데이터 소스 (synthetic=가짜 데이터 시험, fdr=실제 주가)"
        type: choice
        options: [fdr, synthetic]
        default: fdr
      limit:
        description: "종목 수 제한 (비우면 전체 종목, 처음엔 200 추천)"
        required: false
        default: "200"
      start:
        description: "시작일 (비우면 기본값 2021-10-25)"
        required: false
        default: ""
      end:
        description: "종료일 (비우면 기본값 2026-10-23)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 패키지 설치
        run: pip install -r requirements.txt pytest

      - name: 단위 테스트
        run: pytest -q

      - name: 주가 데이터 캐시
        if: inputs.source == 'fdr'
        uses: actions/cache@v4
        with:
          path: cache
          key: price-cache-${{ inputs.end || 'default' }}-${{ github.run_id }}
          restore-keys: price-cache-${{ inputs.end || 'default' }}-

      - name: 백테스트
        run: |
          ARGS="--source ${{ inputs.source }}"
          if [ -n "${{ inputs.limit }}" ]; then ARGS="$ARGS --limit ${{ inputs.limit }}"; fi
          if [ -n "${{ inputs.start }}" ]; then ARGS="$ARGS --start ${{ inputs.start }}"; fi
          if [ -n "${{ inputs.end }}" ]; then ARGS="$ARGS --end ${{ inputs.end }}"; fi
          python run_backtest.py $ARGS

      - name: 결과 요약을 실행 화면에 표시
        if: always()
        run: |
          if [ -f results/report.md ]; then cat results/report.md >> "$GITHUB_STEP_SUMMARY"; fi

      - name: 결과 파일 업로드
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backtest-results
          path: results/

      - name: 결과를 results 브랜치에 저장 (Claude가 읽을 수 있게)
        if: always()
        run: |
          [ -d results ] || exit 0
          cp -r results /tmp/bt_results
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git checkout --orphan results-tmp
          git rm -rf . -q
          rm -rf cache
          cp -r /tmp/bt_results/. .
          echo "실행: ${{ github.run_id }} / 소스: ${{ inputs.source }} / 종목수: ${{ inputs.limit }}" > RUN_INFO.txt
          git add -A
          git commit -qm "백테스트 결과 run ${{ github.run_id }}"
          git push -f origin HEAD:results
